    <path transform="translate(33 0)" d="M2 0V20M2 2H7.5A4 4 0 0 1 7.5 10H2M2 10H8.5A4 4 0 0 1 8.5 18H2"/>
  </g>
  <g transform="translate(42 9) scale(.7)">
    <g class="ink">
