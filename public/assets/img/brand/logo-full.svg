<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 116 32" role="img" aria-labelledby="t">
  <title id="t">TFB PDF</title>
  <!-- TFB PDF tam logo (açık zemin için): işaret + kelime işareti. Koyu zemin için logo-full-inverse.svg.
       Satır içi kullanımda renkler --tfb-logo-ink / --tfb-logo-accent değişkenleriyle değiştirilebilir. -->
  <style>
    .doc{fill:#E5484D}.fold{fill:#fff;fill-opacity:.42}
    .letters,.ink,.accent{fill:none;stroke-width:4;stroke-linecap:butt;stroke-linejoin:miter}
    .letters{stroke:#fff}.ink{stroke:var(--tfb-logo-ink,#16181D)}.accent{stroke:var(--tfb-logo-accent,#E5484D)}
  </style>
  <path class="doc" d="M6.5 1.5H21L29 9.5V27a3.5 3.5 0 0 1-3.5 3.5h-19A3.5 3.5 0 0 1 3 27V5a3.5 3.5 0 0 1 3.5-3.5Z"/>
